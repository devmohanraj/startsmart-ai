spring.application.name=StartSmart AI

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.driver-class-name=org.postgresql.Driver

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

reports.dir=${REPORTS_DIR:reports}

# Lightweight keep-alive / health endpoint for external cron pings.
# Deliberately excludes the DB health contributor so the health check reflects
# the application context being up, not the availability of downstream services
# (Neon / ML engine) which may legitimately be slow or unreachable.
management.endpoints.web.exposure.include=health
management.health.db.enabled=false